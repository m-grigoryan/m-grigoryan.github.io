<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mihran Grigoryan | IT Project Manager</title>
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />
    <script>
      (function () {
        if ("scrollRestoration" in window.history) {
          window.history.scrollRestoration = "manual";
        }

        function forceTopIfNoHash() {
          if (window.location.hash) return;
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          if (document.body) {
            document.body.scrollTop = 0;
          }
        }

        forceTopIfNoHash();
        window.addEventListener("DOMContentLoaded", forceTopIfNoHash, { once: true });
        window.addEventListener("load", forceTopIfNoHash, { once: true });
        window.addEventListener("pageshow", forceTopIfNoHash);
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              apple: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'sans-serif']
            },
            colors: {
              ink: "#030712",
              violet: "#7c3cff",
              electric: "#3268ff"
            },
            boxShadow: {
              glow: "0 0 34px rgba(124, 60, 255, .34)"
            },
            keyframes: {
              aura: {
                "0%, 100%": { transform: "translate3d(0, 0, 0) scale(1)", opacity: ".86" },
                "50%": { transform: "translate3d(-10px, -8px, 0) scale(1.04)", opacity: "1" }
              },
              float: {
                "0%, 100%": { transform: "translate3d(0, 0, 0)" },
                "50%": { transform: "translate3d(8px, -10px, 0)" }
              },
              rise: {
                "0%": { opacity: "0", transform: "translateY(18px)" },
                "100%": { opacity: "1", transform: "translateY(0)" }
              }
            },
            animation: {
              aura: "aura 8s ease-in-out infinite",
              float: "float 12s ease-in-out infinite",
              rise: "rise .8s ease-out both"
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="./assets/css/site.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./assets/js/app.js"></script>
  </body>
</html>

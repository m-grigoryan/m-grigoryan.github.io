      (function () {
        if ("scrollRestoration" in window.history) {
          window.history.scrollRestoration = "manual";
        }

        function forceTopIfNoHash() {
          if (window.location.hash) return;
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          if (document.body) {
            document.body.scrollTop = 0;
          }
        }

        forceTopIfNoHash();
        window.addEventListener("DOMContentLoaded", forceTopIfNoHash, { once: true });
        window.addEventListener("load", forceTopIfNoHash, { once: true });
        window.addEventListener("pageshow", forceTopIfNoHash);
      })();
    </script>

      function ContactItem({ Icon, label, text, href, copyValue, singleLine = false }) {
        const [copied, setCopied] = useState(false);

        async function handleCopy(event) {
          event.preventDefault();
          event.stopPropagation();

          try {
            if (navigator.clipboard?.writeText) {
              await navigator.clipboard.writeText(copyValue);
            } else {
              const helper = document.createElement("textarea");
              helper.value = copyValue;
              helper.setAttribute("readonly", "");
              helper.style.position = "absolute";
              helper.style.left = "-9999px";
              document.body.appendChild(helper);
              helper.select();
              document.execCommand("copy");
              document.body.removeChild(helper);
            }

            setCopied(true);
            window.setTimeout(() => setCopied(false), 1800);
          } catch (error) {
            console.error("Unable to copy text", error);
          }
        }

        const iconCell = h(
          "div",
          {
            className:
              "grid h-[70px] w-[70px] shrink-0 place-items-center rounded-xl border border-white/[.12] bg-white/[.04] text-[#a855ff] transition duration-300 group-hover:border-violet/60 group-hover:text-[#c3a3ff] group-hover:shadow-glow"
          },
          h(Icon, { size: 30, strokeWidth: 1.9, fill: Icon === Linkedin ? "currentColor" : "none" })
        );

        const textBlock = h(
          "div",
          { className: "min-w-0" },
          h("p", { className: "text-xl font-semibold text-white" }, label),
          h("p", { className: `mt-2 text-white/72 ${singleLine ? "overflow-hidden text-ellipsis whitespace-nowrap text-[15px] leading-7 sm:text-base xl:text-[17px]" : "break-words text-lg leading-7"}` }, text)
        );

        const primaryContent = href
          ? h(
              "a",
              {
                href,
                target: href.startsWith("http") ? "_blank" : undefined,
                rel: href.startsWith("http") ? "noopener noreferrer" : undefined,
                className: "flex min-w-0 flex-1 items-center gap-4 sm:gap-6"
              },
              iconCell,
              textBlock
            )
          : h(
              "div",
              { className: "flex min-w-0 flex-1 items-center gap-4 sm:gap-6" },
              iconCell,
              textBlock
            );

        const copyButton = copyValue
          ? h(
              "button",
              {
                type: "button",
                onClick: handleCopy,
                className:
                  "shrink-0 rounded-full border border-white/[.14] bg-white/[.035] px-3 py-1.5 text-sm font-medium text-white/76 transition duration-300 hover:border-violet/60 hover:bg-white/[.06] hover:text-white"
              },
              copied ? "Copied" : "Copy email"
            )
          : null;

        return h(
          "div",
          { className: "group flex items-center gap-4 border-b border-white/[.1] pb-6 transition duration-300 sm:gap-6" },
          primaryContent,
          copyButton
        );
      }

      function ContactsSection({ isVisible }) {
        return h(

          { id: "contacts", className: `section-shell reveal-section ${isVisible ? "is-visible" : ""} relative scroll-mt-20 overflow-hidden px-5 py-24 text-white sm:px-8 lg:scroll-mt-[100px] lg:px-20 lg:py-28 xl:scroll-mt-[122px]` },
          h("div", { className: "grid-glow pointer-events-none absolute inset-0 opacity-35" }),
          h("div", { className: "pointer-events-none absolute left-[8%] top-[18%] h-80 w-80 rounded-full bg-electric/10 blur-3xl" }),
          h("div", { className: "pointer-events-none absolute right-[18%] top-[12%] h-96 w-96 rounded-full bg-violet/14 blur-3xl" }),
          h(
            "div",
            { className: "relative mx-auto max-w-[1328px]" },
            h(
              "div",
              {
                className:
                  "pointer-react rounded-[28px] border border-violet/25 bg-[#08101f]/58 p-7 shadow-[0_28px_100px_rgba(0,0,0,.28)] backdrop-blur-2xl transition duration-300 hover:border-violet/40 hover:shadow-glow sm:p-10 lg:p-12"
              },
              h("div", { className: "mb-8" }, h(Pill, null, "Contact")),
              h("div", { className: "grid gap-10 lg:grid-cols-[minmax(0,.95fr)_minmax(420px,.92fr)] lg:items-start lg:gap-16" }, [
                h(
                  "div",
                  { key: "intro" },
                  h(
                    "h2",
                    { className: "text-[48px] font-bold leading-tight text-white sm:text-[64px] lg:text-[66px]" },
                    "Let’s Work",
                    h("br"),
                    h("span", { className: "bg-gradient-to-r from-electric via-violet to-[#9b4dff] bg-clip-text text-transparent" }, "Together.")
                  ),
                  h("p", { className: "mt-6 max-w-[540px] text-lg leading-8 text-white/72 sm:text-xl" }, "Have a project in mind or want to discuss how I can help your team deliver results? Let’s connect.")
                ),
                h("div", { key: "details", className: "flex max-w-[620px] flex-col gap-6" }, [
                  h(ContactItem, { key: "email", Icon: Mail, label: "Email", text: "mihran.s.grigoryan@gmail.com", href: "mailto:mihran.s.grigoryan@gmail.com", copyValue: "mihran.s.grigoryan@gmail.com", singleLine: true }),
                  h(ContactItem, { key: "location", Icon: MapPin, label: "Location", text: "Yerevan, RA" }),
                  h(ContactItem, { key: "linkedin", Icon: Linkedin, label: "LinkedIn", text: "https://www.linkedin.com/in/mihran-grigoryan-/", href: "https://www.linkedin.com/in/mihran-grigoryan-/", singleLine: true })
                ])
              ])
            )
          )
        );
      }

      function ProjectModal({ project, index, activeImage, setActiveImage, onClose, onStep }) {
        if (!project) return null;
        const thumbs = Array.from({ length: project.images ? project.images.length : 3 }, (_, thumb) => thumb);

        return h(
          "div",
          { className: "modal-backdrop fixed inset-0 z-[70] flex items-center justify-center px-4 py-6 text-white" },
          h(
            "div",
            { className: "relative grid max-h-[92vh] w-full max-w-[990px] overflow-y-auto rounded-2xl border border-violet/30 bg-[#070b17]/95 p-5 shadow-[0_30px_110px_rgba(0,0,0,.62)] md:grid-cols-[.75fr_1.25fr] md:gap-7 md:p-8" },
            h(
              "button",
              { type: "button", onClick: onClose, "aria-label": "Close modal", className: "absolute right-5 top-5 z-10 grid h-10 w-10 place-items-center rounded-full text-white/80 transition hover:bg-white/10 hover:text-white" },
              h(X, { size: 24 })
            ),
            h(
              "div",
              { className: "pr-0 md:pr-2" },
              h("p", { className: "text-sm font-semibold uppercase tracking-wide text-[#9b65ff]" }, project.category),
              h("h3", { className: "mt-3 max-w-[360px] text-3xl font-bold leading-tight text-white md:text-4xl" }, project.title),
              h("p", { className: "mt-5 text-base leading-8 text-white/68" }, project.description),
              h(
                "button",
                { type: "button", onClick: onClose, className: "mt-8 inline-flex items-center gap-3 rounded-lg bg-gradient-to-r from-electric to-violet px-5 py-4 text-sm font-semibold text-white transition duration-300 hover:-translate-y-1 hover:shadow-glow" },
                h(ArrowLeft, { size: 18 }),
                "Back to Projects"
              )
            ),
            h(
            "div",
            { className: "mt-7 md:mt-8" },
              h("div", { className: "overflow-hidden rounded-xl border border-white/[.1] bg-black/20" }, h(ProjectVisual, { project, variant: activeImage })),
              h(
                "div",
                { className: "mt-4 flex items-center gap-3 rounded-xl border border-white/[.1] bg-white/[.03] p-4" },
                h("button", { type: "button", onClick: () => onStep(-1), "aria-label": "Previous image", className: "grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-violet/15 text-white transition hover:bg-violet/30" }, h(ChevronLeft, { size: 22 })),
                h(
                  "div",
                  { className: "grid flex-1 grid-cols-3 gap-3" },
                  thumbs.map((thumb) =>
                    h(
                      "button",
                      {
                        key: thumb,
                        type: "button",
                        onClick: () => setActiveImage(thumb),
                        className: `h-20 overflow-hidden rounded-lg border transition duration-300 ${activeImage === thumb ? "border-violet shadow-glow" : "border-white/[.12] opacity-70 hover:opacity-100"}`
                      },
                      h(ProjectVisual, { project, variant: thumb, compact: true })
                    )
                  )
                ),
                h("button", { type: "button", onClick: () => onStep(1), "aria-label": "Next image", className: "grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-violet/15 text-white transition hover:bg-violet/30" }, h(ChevronRight, { size: 22 }))
              )
            )
          )
        );
      }

      function App() {
        const [activeSection, setActiveSection] = useState("home");
        const [visibleSections, setVisibleSections] = useState({ home: true });
        const [modalIndex, setModalIndex] = useState(null);
        const [activeImage, setActiveImage] = useState(0);
        const selectedProject = modalIndex === null ? null : projects[modalIndex];

        useEffect(() => {
          const frame = window.requestAnimationFrame(() => {
            document.body.classList.add("page-ready");
          });

          return () => {
            window.cancelAnimationFrame(frame);
            document.body.classList.remove("page-ready");
          };
        }, []);

        useEffect(() => {
          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  setActiveSection(entry.target.id);
                  setVisibleSections((current) => (current[entry.target.id] ? current : { ...current, [entry.target.id]: true }));
                }
              });
            },
            { rootMargin: "-42% 0px -45% 0px", threshold: 0 }
          );

          ["home", "portfolio", "certifications", "contacts"].forEach((id) => {
            const section = document.getElementById(id);
            if (section) observer.observe(section);
          });

          return () => observer.disconnect();
        }, []);

        useEffect(() => {
          if ("scrollRestoration" in window.history) {
            window.history.scrollRestoration = "manual";
          }

          function syncHashScroll() {
            const id = window.location.hash.replace("#", "");
            if (!id) {
              [0, 80, 220].forEach((delay) => {
                window.setTimeout(() => {
                  window.scrollTo({ top: 0, left: 0, behavior: "auto" });
                  document.documentElement.scrollTop = 0;
                  if (document.body) {
                    document.body.scrollTop = 0;
                  }
                }, delay);
              });
              return;
            }

            window.setTimeout(() => {
              const target = document.getElementById(id);
              if (target) target.scrollIntoView({ behavior: "auto", block: "start" });
            }, 160);
          }

          syncHashScroll();
          window.addEventListener("hashchange", syncHashScroll);
          return () => {
            window.removeEventListener("hashchange", syncHashScroll);
            if ("scrollRestoration" in window.history) {
              window.history.scrollRestoration = "auto";
            }
          };
        }, []);

        useEffect(() => {
          document.body.classList.toggle("modal-open", selectedProject !== null);
          return () => document.body.classList.remove("modal-open");
        }, [selectedProject]);

        useEffect(() => {
          const interactiveElements = Array.from(document.querySelectorAll(".pointer-react"));

          function updatePointer(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 100;
            const y = ((event.clientY - rect.top) / rect.height) * 100;
            event.currentTarget.style.setProperty("--mx", `${x}%`);
            event.currentTarget.style.setProperty("--my", `${y}%`);
          }

          interactiveElements.forEach((element) => {
            element.addEventListener("pointermove", updatePointer);
          });

          return () => {
            interactiveElements.forEach((element) => {
              element.removeEventListener("pointermove", updatePointer);
            });
          };
        }, [modalIndex, visibleSections]);

        function openProject(index) {
          setActiveImage(0);
          setModalIndex(index);
        }

        function stepImage(direction) {
          const imageCount = selectedProject?.images?.length || 3;
          setActiveImage((current) => (current + direction + imageCount) % imageCount);
        }

        return h(
          React.Fragment,
          null,
          h(Header, { activeSection }),
          h("main", null, h(Hero, { isVisible: visibleSections.home }), h(PortfolioSection, { onOpenProject: openProject, isVisible: visibleSections.portfolio }), h(CertificationsSection, { isVisible: visibleSections.certifications }), h(ContactsSection, { isVisible: visibleSections.contacts })),
          h(ProjectModal, {
            project: selectedProject,
            index: modalIndex,
            activeImage,
            setActiveImage,
            onClose: () => setModalIndex(null),
            onStep: stepImage
          })
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>

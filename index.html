    <script>
      (function () {
        if ("scrollRestoration" in window.history) {
          window.history.scrollRestoration = "manual";
        }

        function forceTopIfNoHash() {
          if (window.location.hash) return;
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          if (document.body) {
            document.body.scrollTop = 0;
          }
        }

        forceTopIfNoHash();
        window.addEventListener("DOMContentLoaded", forceTopIfNoHash, { once: true });
        window.addEventListener("load", forceTopIfNoHash, { once: true });
        window.addEventListener("pageshow", forceTopIfNoHash);
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              apple: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'sans-serif']
            },
            colors: {
              ink: "#030712",
              violet: "#7c3cff",
              electric: "#3268ff"
            },
            boxShadow: {
              glow: "0 0 34px rgba(124, 60, 255, .34)"
            },
            keyframes: {
              aura: {
                "0%, 100%": { transform: "translate3d(0, 0, 0) scale(1)", opacity: ".86" },
                "50%": { transform: "translate3d(-10px, -8px, 0) scale(1.04)", opacity: "1" }
              },
              float: {
                "0%, 100%": { transform: "translate3d(0, 0, 0)" },
                "50%": { transform: "translate3d(8px, -10px, 0)" }
              },
              rise: {
                "0%": { opacity: "0", transform: "translateY(18px)" },
                "100%": { opacity: "1", transform: "translateY(0)" }
              }
            },
            animation: {
              aura: "aura 8s ease-in-out infinite",
              float: "float 12s ease-in-out infinite",
              rise: "rise .8s ease-out both"
            }
          }
        }
      };
    </script>
    <style>
      html {
        max-width: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
        background: #030712;
        opacity: 0;
        transition: opacity .36s ease;
        overflow-x: hidden;
      }

      #root {
        max-width: 100%;
        overflow-x: hidden;
      }

      body.page-ready {
        opacity: 1;
      }

      .hero-shell {
        background:
          radial-gradient(circle at 20% 20%, rgba(124, 60, 255, .08), transparent 30rem),
          radial-gradient(circle at 80% 30%, rgba(49, 104, 255, .06), transparent 28rem),
          linear-gradient(180deg, #030712 0%, #050a14 40%, #030712 100%);
      }

      .grid-glow {
        background-image:
          linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(circle at 50% 32%, black, transparent 70%);
      }

      .dots {
        background-image: radial-gradient(circle, rgba(132, 86, 255, .9) 1.6px, transparent 1.8px);
        background-size: 32px 32px;
      }

      .ring-lines {
        background:
          repeating-radial-gradient(circle at 50% 52%, rgba(123, 87, 255, .2) 0 1px, transparent 1px 72px);
      }

      .section-shell {
        background:
          radial-gradient(circle at 12% 12%, rgba(49, 104, 255, .12), transparent 31rem),
          radial-gradient(circle at 72% 18%, rgba(124, 60, 255, .14), transparent 36rem),
          linear-gradient(180deg, #02050c 0%, #07101c 52%, #02040b 100%);
      }

      .glass {
        background: rgba(5, 10, 20, .54);
        border: 1px solid rgba(255, 255, 255, .12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
        backdrop-filter: blur(18px);
      }

      .load-sequence > * {
        opacity: 0;
        transform: translate3d(0, 18px, 0);
        transition:
          opacity .58s cubic-bezier(.22, 1, .36, 1),
          transform .58s cubic-bezier(.22, 1, .36, 1);
      }

      body.page-ready .load-sequence > * {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      .load-sequence > *:nth-child(1) { transition-delay: .04s; }
      .load-sequence > *:nth-child(2) { transition-delay: .10s; }
      .load-sequence > *:nth-child(3) { transition-delay: .16s; }
      .load-sequence > *:nth-child(4) { transition-delay: .22s; }
      .load-sequence > *:nth-child(5) { transition-delay: .28s; }
      .load-sequence > *:nth-child(6) { transition-delay: .34s; }
      .load-sequence > *:nth-child(7) { transition-delay: .40s; }

      .hero-visual {
        opacity: 0;
        transform: translate3d(22px, 18px, 0) scale(.985);
        transition:
          opacity .72s cubic-bezier(.22, 1, .36, 1),
          transform .72s cubic-bezier(.22, 1, .36, 1);
        transition-delay: .18s;
      }

      body.page-ready .hero-visual {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }

      .reveal-section {
        opacity: 0;
        transform: translate3d(0, 30px, 0);
        transition:
          opacity .7s cubic-bezier(.22, 1, .36, 1),
          transform .7s cubic-bezier(.22, 1, .36, 1);
      }

      .reveal-section.is-visible {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      .pointer-react {
        position: relative;
        isolation: isolate;
      }

      .pointer-react::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(124, 60, 255, .18), transparent 54%);
        opacity: 0;
        transition: opacity .28s ease;
        pointer-events: none;
        z-index: 0;
      }

      .pointer-react:hover::after {
        opacity: 1;
      }

      .pointer-react > * {
        position: relative;
        z-index: 1;
      }

      .portrait-crop {
        background-image: url("./assets/hero/HomeHeroPortrait.png");
        background-size: auto 100%;
        background-position: center bottom;
        background-repeat: no-repeat;
        filter: drop-shadow(0 24px 58px rgba(0, 0, 0, .48));
      }

      .product-visual {
        background:
          radial-gradient(circle at 22% 18%, rgba(124, 60, 255, .5), transparent 18rem),
          radial-gradient(circle at 82% 12%, rgba(50, 104, 255, .32), transparent 16rem),
          linear-gradient(135deg, #10192d 0%, #080d1b 55%, #050713 100%);
      }

      .product-visual::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(2, 5, 12, .02), rgba(2, 5, 12, .66));
        pointer-events: none;
      }

      .modal-backdrop {
        background: rgba(1, 4, 12, .78);
        backdrop-filter: blur(14px);
      }

      body.modal-open {
        overflow: hidden;
      }

      body.mobile-menu-open {
        overflow: hidden;
      }

      }

      @media (min-width: 1024px) and (max-height: 760px) {

      function ContactItem({ Icon, label, text, href, copyValue, singleLine = false }) {
        const [copied, setCopied] = useState(false);

        async function handleCopy(event) {
          event.preventDefault();
          event.stopPropagation();

          try {
            if (navigator.clipboard?.writeText) {
              await navigator.clipboard.writeText(copyValue);
            } else {
              const helper = document.createElement("textarea");
              helper.value = copyValue;
              helper.setAttribute("readonly", "");
              helper.style.position = "absolute";
              helper.style.left = "-9999px";
              document.body.appendChild(helper);
              helper.select();
              document.execCommand("copy");
              document.body.removeChild(helper);
            }

            setCopied(true);
            window.setTimeout(() => setCopied(false), 1800);
          } catch (error) {
            console.error("Unable to copy text", error);
          }
        }

        const iconCell = h(
          "div",
          {
            className:
              "grid h-[70px] w-[70px] shrink-0 place-items-center rounded-xl border border-white/[.12] bg-white/[.04] text-[#a855ff] transition duration-300 group-hover:border-violet/60 group-hover:text-[#c3a3ff] group-hover:shadow-glow"
          },
          h(Icon, { size: 30, strokeWidth: 1.9, fill: Icon === Linkedin ? "currentColor" : "none" })
        );

        const textBlock = h(
          "div",
          { className: "min-w-0" },
          h("p", { className: "text-xl font-semibold text-white" }, label),
          h("p", { className: `mt-2 text-white/72 ${singleLine ? "overflow-hidden text-ellipsis whitespace-nowrap text-[15px] leading-7 sm:text-base xl:text-[17px]" : "break-words text-lg leading-7"}` }, text)
        );

        const primaryContent = href
          ? h(
              "a",
              {
                href,
                target: href.startsWith("http") ? "_blank" : undefined,
                rel: href.startsWith("http") ? "noopener noreferrer" : undefined,
                className: "flex min-w-0 flex-1 items-center gap-4 sm:gap-6"
              },
              iconCell,
              textBlock
            )
          : h(
              "div",
              { className: "flex min-w-0 flex-1 items-center gap-4 sm:gap-6" },
              iconCell,
              textBlock
            );

        const copyButton = copyValue
          ? h(
              "button",
              {
                type: "button",
                onClick: handleCopy,
                className:
                  "shrink-0 rounded-full border border-white/[.14] bg-white/[.035] px-3 py-1.5 text-sm font-medium text-white/76 transition duration-300 hover:border-violet/60 hover:bg-white/[.06] hover:text-white"
              },
              copied ? "Copied" : "Copy email"
            )
          : null;

        return h(
          "div",
          { className: "group flex items-center gap-4 border-b border-white/[.1] pb-6 transition duration-300 sm:gap-6" },
          primaryContent,
          copyButton
        );
      }

          h("div", { className: "pointer-events-none absolute left-[8%] top-[18%] h-80 w-80 rounded-full bg-electric/10 blur-3xl" }),
          h("div", { className: "pointer-events-none absolute right-[18%] top-[12%] h-96 w-96 rounded-full bg-violet/14 blur-3xl" }),

              },

                h(

                  h(ContactItem, { key: "location", Icon: MapPin, label: "Location", text: "Yerevan, RA" }),

              h(

            h(

              h(
                "div",
                { className: "mt-4 flex items-center gap-3 rounded-xl border border-violet/15 bg-[radial-gradient(180deg,rgba(14,20,40,.7)_0%,rgba(8,12,22,.8)_100%)] p-4 shadow-[inset_0_1px_0_rgba(255,255,255,.03)]" },
                h("button", { type: "button", onClick: () => onStep(-1), "aria-label": "Previous image", className: "grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-violet/15 text-white transition hover:bg-violet/30" }, h(ChevronLeft, { size: 22 })),
                h(
                  "div",
                  { className: "grid flex-1 grid-cols-3 gap-3" },
                  thumbs.map((thumb) =>
                    h(
                      "button",
                      {
                        key: thumb,

                        onClick: () => setActiveImage(thumb),
                        className: `h-20 overflow-hidden rounded-lg border transition duration-300 ${activeImage === thumb ? "border-violet shadow-glow" : "border-violet/10 bg-[radial-gradient(180deg,rgba(12,18,35,.8)_0%,rgba(8,12,22,.9)_100%)] opacity-70 hover:opacity-100 hover:border-violet/30"}`
                      },
                      h(ProjectVisual, { project, variant: thumb, compact: true })
                    )
                  )
                ),
                h("button", { type: "button", onClick: () => onStep(1), "aria-label": "Next image", className: "grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-violet/15 text-white transition hover:bg-violet/30" }, h(ChevronRight, { size: 22 }))
              )
            )
          )
        );
      }

      function App() {
        const [activeSection, setActiveSection] = useState("home");
        const [visibleSections, setVisibleSections] = useState({ home: true });
        const [modalIndex, setModalIndex] = useState(null);
        const [activeImage, setActiveImage] = useState(0);
        const selectedProject = modalIndex === null ? null : projects[modalIndex];

        useEffect(() => {
          const frame = window.requestAnimationFrame(() => {
            document.body.classList.add("page-ready");
          });

          return () => {
            window.cancelAnimationFrame(frame);
            document.body.classList.remove("page-ready");
          };
        }, []);

        useEffect(() => {
          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  setActiveSection(entry.target.id);
                  setVisibleSections((current) => (current[entry.target.id] ? current : { ...current, [entry.target.id]: true }));
                }
              });
            },
            { rootMargin: "-42% 0px -45% 0px", threshold: 0 }
          );

          ["home", "portfolio", "certifications", "tools", "contacts"].forEach((id) => {
            const section = document.getElementById(id);
            if (section) observer.observe(section);
          });

          return () => observer.disconnect();
        }, []);

        useEffect(() => {
          if ("scrollRestoration" in window.history) {
            window.history.scrollRestoration = "manual";
          }

          function syncHashScroll() {
            const id = window.location.hash.replace("#", "");
            if (!id) {
              [0, 80, 220].forEach((delay) => {
                window.setTimeout(() => {
                  window.scrollTo({ top: 0, left: 0, behavior: "auto" });
                  document.documentElement.scrollTop = 0;
                  if (document.body) {
                    document.body.scrollTop = 0;
                  }
                }, delay);
              });
              return;
            }

            window.setTimeout(() => {
              const target = document.getElementById(id);
              if (target) target.scrollIntoView({ behavior: "auto", block: "start" });
            }, 160);
          }

          syncHashScroll();
          window.addEventListener("hashchange", syncHashScroll);
          return () => {
            window.removeEventListener("hashchange", syncHashScroll);
            if ("scrollRestoration" in window.history) {
              window.history.scrollRestoration = "auto";
            }
          };
        }, []);

        useEffect(() => {
          document.body.classList.toggle("modal-open", selectedProject !== null);
          return () => document.body.classList.remove("modal-open");
        }, [selectedProject]);

        useEffect(() => {
          const interactiveElements = Array.from(document.querySelectorAll(".pointer-react"));

          function updatePointer(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 100;
            const y = ((event.clientY - rect.top) / rect.height) * 100;
            event.currentTarget.style.setProperty("--mx", `${x}%`);
            event.currentTarget.style.setProperty("--my", `${y}%`);
          }

          interactiveElements.forEach((element) => {
            element.addEventListener("pointermove", updatePointer);
          });

          return () => {
            interactiveElements.forEach((element) => {
              element.removeEventListener("pointermove", updatePointer);
            });
          };
        }, [modalIndex, visibleSections]);

        function openProject(index) {
          setActiveImage(0);
          setModalIndex(index);
        }

        function stepImage(direction) {
          const imageCount = selectedProject?.images?.length || 3;
          setActiveImage((current) => (current + direction + imageCount) % imageCount);
        }

        return h(
          React.Fragment,
          null,
          h(Header, { activeSection }),
          h("main", null, h(Hero, { isVisible: visibleSections.home }), h(PortfolioSection, { onOpenProject: openProject, isVisible: visibleSections.portfolio }), h(CertificationsSection, { isVisible: visibleSections.certifications }), h(ToolsSection, { isVisible: visibleSections.tools }), h(ContactsSection, { isVisible: visibleSections.contacts })),
          h(ProjectModal, {
            project: selectedProject,
            index: modalIndex,
            activeImage,
            setActiveImage,
            onClose: () => setModalIndex(null),
            onStep: stepImage
          })
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
